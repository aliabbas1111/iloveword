<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

  <header class="bg-white border-b border-gray-200 sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
      <a href="#" class="flex items-center gap-3">
        <span class="bg-blue-600 text-white rounded-xl font-bold text-lg flex items-center justify-center w-10 h-10 shadow-md">
          <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#fa-file-word"></use></svg>
        </span>
        <span class="text-2xl font-bold tracking-tight text-blue-900">ILove<span class="text-blue-600">Word</span></span>
      </a>

      <div class="flex items-center gap-3">
        <span id="engine-badge" class="hidden sm:inline text-xs px-2 py-1 rounded-full bg-gray-100 text-gray-500" title=""></span>
        <label for="langSelect" class="sr-only" data-i18n="ui_language">اللغة</label>
        <select id="langSelect" class="bg-gray-100 border border-gray-300 text-gray-700 text-sm rounded-lg px-3 py-1.5 focus:ring-2 focus:ring-blue-500">
          <option value="ar">العربية</option>
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="fr">Français</option>
        </select>
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-10">
    <div class="text-center mb-10">
      <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-900 mb-3" data-i18n="ui_title"></h1>
      <p class="text-gray-600 text-lg" data-i18n="ui_subtitle"></p>
    </div>

    <div class="mb-6 max-w-md mx-auto relative">
      <svg class="icon absolute top-1/2 -translate-y-1/2 start-4 text-gray-400" aria-hidden="true"><use href="assets/icons.svg#fa-magnifying-glass"></use></svg>
      <input id="search" type="search" autocomplete="off"
             class="w-full ps-11 pe-4 py-3 rounded-2xl border border-gray-200 bg-white shadow-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
             data-i18n-placeholder="ui_search">
    </div>

    <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-5"></div>
    <p id="no-results" class="text-center text-gray-500 py-12" hidden data-i18n="ui_no_results"></p>
  </main>

  <footer class="bg-white border-t border-gray-200 py-6 text-center text-sm text-gray-500">
    <p data-i18n="ui_footer"></p>
  </footer>

  <!-- ------------------------------------------------------------------ -->
  <div id="modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 p-4 items-center justify-center" hidden
       role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
      <button id="modal-close" class="absolute top-4 end-4 text-gray-400 hover:text-gray-700 text-2xl leading-none w-8 h-8"
              aria-label="Close">&times;</button>

      <div class="text-center pt-2">
        <div id="modal-icon" class="w-14 h-14 rounded-2xl mx-auto flex items-center justify-center text-2xl mb-3"></div>
        <h2 id="modal-title" class="text-2xl font-bold text-gray-800 mb-1"></h2>
        <p id="modal-desc" class="text-gray-500 text-sm mb-5"></p>
      </div>

      <!-- idle -->
      <div id="state-idle">
        <div id="dropzone" tabindex="0" role="button"
             class="border-2 border-dashed border-blue-300 hover:border-blue-500 bg-blue-50/50 rounded-2xl p-8 flex flex-col items-center justify-center cursor-pointer transition focus:outline-none focus:ring-2 focus:ring-blue-500">
          <svg class="icon text-4xl text-blue-500 mb-3" aria-hidden="true"><use href="assets/icons.svg#fa-cloud-arrow-up"></use></svg>
          <span class="text-sm font-semibold text-gray-700 text-center" data-i18n="ui_drop"></span>
          <span id="accept-hint" class="text-xs text-gray-400 mt-1"></span>
          <input type="file" id="file-input" class="sr-only">
        </div>

        <ul id="file-list" class="mt-4 space-y-2 text-sm"></ul>
        <div id="options" class="mt-4 space-y-3 text-start"></div>

        <button id="run" class="mt-5 w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-bold py-3 rounded-2xl transition" disabled>
          <span data-i18n="ui_process"></span>
        </button>
      </div>

      <!-- working -->
      <div id="state-busy" class="py-10 text-center" hidden>
        <svg class="icon text-4xl text-blue-600 spin" aria-hidden="true"><use href="assets/icons.svg#fa-circle-notch"></use></svg>
        <p class="mt-4 font-semibold text-blue-700" data-i18n="ui_processing"></p>
        <p class="text-xs text-gray-400 mt-1" data-i18n="ui_processing_hint"></p>
      </div>

      <!-- done -->
      <div id="state-done" class="py-8 text-center" hidden>
        <svg class="icon text-5xl text-green-500" aria-hidden="true"><use href="assets/icons.svg#fa-circle-check"></use></svg>
        <p class="mt-4 font-bold text-gray-800" data-i18n="ui_done"></p>
        <p id="done-name" class="text-xs text-gray-500 mt-1 break-all"></p>
        <a id="download" class="mt-5 inline-block bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-2xl" download>
          <svg class="icon me-2" aria-hidden="true"><use href="assets/icons.svg#fa-download"></use></svg><span data-i18n="ui_download"></span>
        </a>
        <button id="again" class="mt-3 block mx-auto text-sm text-blue-600 hover:underline" data-i18n="ui_again"></button>
      </div>

      <!-- report (word-stats) -->
      <div id="state-report" class="py-4" hidden>
        <dl id="report-body" class="grid grid-cols-2 gap-3 text-sm"></dl>
        <button id="again2" class="mt-6 block mx-auto text-sm text-blue-600 hover:underline" data-i18n="ui_again"></button>
      </div>

      <!-- error -->
      <div id="state-error" class="py-8 text-center" hidden>
        <svg class="icon text-5xl text-red-500" aria-hidden="true"><use href="assets/icons.svg#fa-circle-exclamation"></use></svg>
        <p id="error-text" class="mt-4 text-gray-700 font-semibold break-words"></p>
        <button id="retry" class="mt-5 text-sm text-blue-600 hover:underline" data-i18n="ui_retry"></button>
      </div>
    </div>
  </div>
