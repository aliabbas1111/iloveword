# nginx only inherits add_header directives into a location that declares none
# of its own. Any location below that sets its own header must therefore
# re-include this file, or it silently drops every security header.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
# Every asset is local, so the policy needs no 'unsafe-inline' anywhere.
# Re-introducing a CDN would mean weakening this line — that is the trade-off
# being refused.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
