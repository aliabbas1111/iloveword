##############################################################################
# ILoveWord — nginx front end
#
# Serves the static frontend directly and proxies only /api/ and /health to
# uvicorn. Two independent rate-limit zones sit in front of the application
# limits: nginx sheds a flood cheaply, before it ever costs a Python worker.
##############################################################################

user  nginx;
worker_processes  auto;
error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;

    # Do not log the document names users upload — they are personal data.
    log_format  minimal  '$remote_addr - $status $request_method $uri '
                         '$body_bytes_sent ${request_time}s "$http_user_agent"';
    access_log  /dev/stdout minimal;   # docker logs, not a file — the container is read-only

    sendfile        on;
    tcp_nopush      on;
    server_tokens   off;
    keepalive_timeout  65;

    # ---- upload / timeout budget ----------------------------------------
    # Must be >= ILW_MAX_REQUEST_MB, or nginx returns 413 before the app can
    # produce its own JSON error.
    client_max_body_size      200m;
    client_body_buffer_size   1m;
    client_body_timeout       120s;
    client_header_timeout     30s;
    # A 50 MB document can take minutes through LibreOffice. Anything under
    # the app's own 180s soffice timeout would surface as a bare 504.
    proxy_read_timeout        300s;
    proxy_send_timeout        300s;
    proxy_connect_timeout     10s;
    send_timeout              300s;
    # Stream uploads straight through instead of spooling the whole body.
    proxy_request_buffering   off;
    proxy_buffering           off;

    # ---- compression -----------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/xml;
    # Already-compressed payloads (docx, pdf, zip, woff2) are deliberately absent.

    # ---- rate limiting ---------------------------------------------------
    # 10 MB holds roughly 160k distinct client IPs per zone.
    limit_req_zone  $binary_remote_addr  zone=api_heavy:10m  rate=12r/m;
    limit_req_zone  $binary_remote_addr  zone=api_general:10m rate=60r/m;
    limit_conn_zone $binary_remote_addr  zone=conn_per_ip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    upstream iloveword_app {
        server app:8000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    ##########################################################################
    # HTTP — ACME challenge, everything else redirected
    ##########################################################################
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location /healthz { access_log off; return 200 "ok\n"; }

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    ##########################################################################
    # HTTPS
    #
    # Until certificates exist this block will not start. For a first run
    # without TLS, comment it out and move the location blocks into the
    # port-80 server above.
    ##########################################################################
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        ssl_certificate      /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key  /etc/nginx/certs/privkey.pem;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  1d;
        ssl_session_tickets  off;

        include /etc/nginx/security_headers.conf;

        limit_conn conn_per_ip 20;

        root /usr/share/nginx/html;

        location /healthz { access_log off; return 200 "ok\n"; }

        # ---- heavy conversion endpoints ----------------------------------
        # burst=5 absorbs a legitimate batch; nodelay serves the burst at once
        # rather than queueing, so honest users never sit behind a drip.
        location ~ ^/api/(convert|tools)/(word-to-pdf|pdf-to-docx|word-to-jpg|image-to-docx|html-to-word|markdown-to-word|compress-docx|merge-docx|split-docx|word-stats) {
            limit_req zone=api_heavy burst=5 nodelay;
            limit_conn conn_per_ip 4;
            proxy_pass http://iloveword_app;
            include /etc/nginx/proxy_params_inline;
        }

        # ---- every other API route ---------------------------------------
        location /api/ {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://iloveword_app;
            include /etc/nginx/proxy_params_inline;
        }

        location = /health {
            access_log off;
            proxy_pass http://iloveword_app;
            include /etc/nginx/proxy_params_inline;
        }

        # ---- static frontend ---------------------------------------------
        # Hashed-content assets could be cached for a year; these filenames are
        # stable instead, so a week plus revalidation is the honest setting.
        location /assets/ {
            alias /usr/share/nginx/html/assets/;
            include /etc/nginx/security_headers.conf;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, must-revalidate";
            access_log off;
        }

        location = /app.js {
            include /etc/nginx/security_headers.conf;
            expires 1h;
            add_header Cache-Control "public, max-age=3600, must-revalidate";
        }

        location / {
            include /etc/nginx/security_headers.conf;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
